services:
  - type: web
    name: riselocal-api
    env: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:api
    startCommand: pnpm run start:api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://riselocal.in,https://qa.riselocal.in
  - type: web
    name: riselocal-api-qa
    env: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:api
    startCommand: pnpm run start:api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: qa
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://qa.riselocal.in,https://*.vercel.app
