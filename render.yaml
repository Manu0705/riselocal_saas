services:
  - type: web
    name: riselocal-api
    env: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:api && pnpm run db:generate && pnpm run db:deploy && pnpm run db:sync-check
    startCommand: pnpm run start:api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://riselocal.in,https://www.riselocal.in,https://admin.riselocal.in,https://qa.riselocal.in
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  - type: web
    name: riselocal-api-qa
    env: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:api && pnpm run db:generate && pnpm run db:deploy && pnpm run db:sync-check
    startCommand: pnpm run start:api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: qa
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://qa.riselocal.in,https://*.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
