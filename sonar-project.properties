# Disable TODO warnings
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# Disable export warnings
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6754
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.ts
